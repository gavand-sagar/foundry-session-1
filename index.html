<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foundry Live Demo</title>
<meta name="description" content="Live chat demo connected to a Microsoft Foundry model deployment. Session 1 of Mastering Microsoft Foundry.">
<meta property="og:title" content="Foundry Live Demo">
<meta property="og:description" content="Chat with a real Microsoft Foundry deployment: system prompt, temperature, max tokens and content safety.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f172a'/%3E%3Cpath d='M9 8h14v4H13v3h8v4h-8v5H9z' fill='%230078d4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f172a;--muted:#475569;--line:#e2e8f0;--soft:#f1f5f9;--card:#f8fafc;--bg:#fff;--blue:#0078d4;--orange:#ea580c;--bad:#dc2626}
*{box-sizing:border-box}
body{margin:0;font:16px/1.55 Inter,system-ui,sans-serif;color:var(--ink);background:var(--soft);min-height:100vh;display:flex;flex-direction:column}
h1{font-family:"Space Grotesk",Inter,sans-serif;margin:0;font-size:22px}
.top{background:var(--ink);color:#fff;padding:14px 20px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.top span{color:#94a3b8;font-size:14px}
.top .tag{color:var(--orange);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.pg{flex:1;display:grid;grid-template-columns:320px 1fr;max-width:1200px;width:100%;margin:20px auto;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
@media(max-width:820px){.pg{grid-template-columns:1fr;margin:0;border-radius:0;border:0}}
.setup{padding:20px;border-right:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:16px}
.setup label{font-size:13px;font-weight:600;display:block;margin-bottom:4px}
.setup .v{font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-family:ui-monospace,Consolas,monospace}
textarea,input[type=text],input[type=password]{width:100%;font:inherit;font-size:14px;padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:var(--ink)}
textarea{min-height:130px;resize:vertical}
input[type=range]{width:100%}
.row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.chat{display:flex;flex-direction:column;min-height:70vh}
.chat header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-weight:600}
button{font:inherit;cursor:pointer}
.chat header button{font-size:13px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px}
.log{flex:1;padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 260px)}
.msg{max-width:85%;padding:10px 14px;border-radius:14px;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.msg.u{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--soft);border-bottom-left-radius:4px}
.msg.f{align-self:flex-start;background:#fef2f2;color:var(--bad);border:1px solid #fecaca}
.msg small{display:block;margin-top:6px;font-size:12px;opacity:.7}
.empty{margin:auto;text-align:center;color:var(--muted)}
.samples{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px 10px}
.samples button{font-size:13px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px}
form{display:flex;gap:8px;padding:12px 20px 6px;border-top:1px solid var(--line)}
form button{font-weight:600;background:var(--blue);color:#fff;border:0;border-radius:8px;padding:0 18px}
form button:disabled{opacity:.5;cursor:wait}
.meter{padding:0 20px 14px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
</style>
</head>
<body>
<div class="top"><span class="tag">Session 1 · Live demo</span><h1>Microsoft Foundry Chat Playground</h1><span id="status">Connecting…</span></div>
<main class="pg">
  <aside class="setup">
    <div><label>Deployment</label><div class="v" id="dep">…</div></div>
    <div><label for="sys">System prompt</label>
      <textarea id="sys">You are a helpful, concise assistant for a Microsoft Foundry training session. If you don't know something, say so.</textarea></div>
    <div><label for="temp">Temperature</label><input type="range" id="temp" min="0" max="1" step="0.1" value="0.2"><div class="row"><span>Factual</span><b id="tv">0.2</b><span>Creative</span></div></div>
    <div><label for="maxt">Max response tokens</label><input type="range" id="maxt" min="50" max="1000" step="50" value="400"><div class="row"><span>50</span><b id="mv">400</b><span>1000</span></div></div>
    <div id="pcWrap" hidden><label for="pc">Demo passcode</label><input type="password" id="pc" autocomplete="off"></div>
  </aside>
  <section class="chat">
    <header>Chat history <button id="clear" type="button">Clear</button></header>
    <div class="log" id="log" aria-live="polite"><div class="empty" id="empty">Start with a sample prompt or type your own.</div></div>
    <div class="samples" id="samples">
      <button type="button">Explain a Foundry hub vs a project in two sentences.</button>
      <button type="button">Write a haiku about cloud computing.</button>
      <button type="button">What is temperature in an LLM?</button>
    </div>
    <form id="f"><input type="text" id="q" placeholder="Type user query here" autocomplete="off" aria-label="Message" maxlength="2000"><button id="go">Send</button></form>
    <div class="meter"><span id="tok">0 tokens used this session</span><span id="lat"></span></div>
  </section>
</main>
<script>
(function(){
  const $=id=>document.getElementById(id), log=$('log'), q=$('q');
  let history=[], total=0, busy=false;
  $('temp').oninput=e=>$('tv').textContent=e.target.value;
  $('maxt').oninput=e=>$('mv').textContent=e.target.value;
  fetch('/api/chat').then(r=>r.json()).then(c=>{
    $('dep').textContent=c.deployment||'not configured';
    $('status').textContent=c.configured?'Connected to Azure AI Foundry':'Not configured: set the Azure env vars in Vercel';
    $('pcWrap').hidden=!c.passcode;
  }).catch(()=>{$('status').textContent='API unreachable'});
  function add(cls,text,meta){const e=$('empty');if(e)e.remove();const d=document.createElement('div');d.className='msg '+cls;d.textContent=text;if(meta){const s=document.createElement('small');s.textContent=meta;d.appendChild(s)}log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
  async function send(text){
    text=text.trim(); if(!text||busy) return;
    busy=true; $('go').disabled=true; q.value='';
    add('u',text); history.push({role:'user',content:text});
    const pending=add('a','…'); const t0=performance.now();
    try{
      const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
        system:$('sys').value, messages:history.slice(-10), temperature:+$('temp').value, max_tokens:+$('maxt').value, passcode:$('pc').value})});
      const d=await r.json(); pending.remove();
      const ms=Math.round(performance.now()-t0);
      if(d.filtered){add('f','⚠ Blocked by Azure AI content safety'+(d.categories?' ('+d.categories.join(', ')+')':'')+'.', 'Content filter · '+ms+' ms'); history.pop();}
      else if(!r.ok){add('f','Error: '+(d.error||r.status)); history.pop();}
      else{
        history.push({role:'assistant',content:d.content});
        const u=d.usage||{}; total+=u.total_tokens||0;
        add('a',d.content,(d.model||'')+' · temp '+$('temp').value+' · '+(u.prompt_tokens??'?')+' in / '+(u.completion_tokens??'?')+' out tokens'+(d.finish_reason==='length'?' · truncated (max tokens)':''));
        $('tok').textContent=total+' tokens used this session'; $('lat').textContent='Last response '+ms+' ms';
      }
    }catch(e){pending.remove(); add('f','Network error: '+e.message); history.pop();}
    busy=false; $('go').disabled=false; q.focus();
  }
  $('f').onsubmit=e=>{e.preventDefault();send(q.value)};
  $('samples').onclick=e=>{if(e.target.tagName==='BUTTON')send(e.target.textContent)};
  $('clear').onclick=()=>{history=[];total=0;log.innerHTML='<div class="empty" id="empty">Start with a sample prompt or type your own.</div>';$('tok').textContent='0 tokens used this session';$('lat').textContent=''};
})();
</script>
</body>
</html>
